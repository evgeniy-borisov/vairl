<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Methods for neuro-symbolic banking agents</title>
  <desc id="desc">Neural estimates pass through exact solvers, symbolic policy and a human gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#142d46"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1090" cy="80" r="190" fill="#0ea5e9" opacity=".08"/>
  <circle cx="90" cy="590" r="220" fill="#22c55e" opacity=".06"/>

  <text x="70" y="88" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">VAIRL / BANKING AGENTS</text>
  <text x="70" y="145" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="750">Methods for neuro-symbolic</text>
  <text x="70" y="198" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="750">banking agents</text>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="70" y="270" width="230" height="150" rx="18" fill="#123b5a" stroke="#38bdf8" stroke-width="2"/>
    <text x="185" y="318" text-anchor="middle" fill="#bae6fd" font-size="22" font-weight="700">NEURAL</text>
    <text x="185" y="352" text-anchor="middle" fill="#e0f2fe" font-size="17">forecast / regime</text>
    <text x="185" y="380" text-anchor="middle" fill="#e0f2fe" font-size="17">document extraction</text>

    <rect x="355" y="270" width="230" height="150" rx="18" fill="#243958" stroke="#a78bfa" stroke-width="2"/>
    <text x="470" y="318" text-anchor="middle" fill="#ddd6fe" font-size="22" font-weight="700">SOLVERS</text>
    <text x="470" y="352" text-anchor="middle" fill="#ede9fe" font-size="17">Markowitz / Merton</text>
    <text x="470" y="380" text-anchor="middle" fill="#ede9fe" font-size="17">Brinson / CVaR</text>

    <rect x="640" y="270" width="230" height="150" rx="18" fill="#173f3b" stroke="#34d399" stroke-width="2"/>
    <text x="755" y="318" text-anchor="middle" fill="#a7f3d0" font-size="22" font-weight="700">SYMBOLIC</text>
    <text x="755" y="352" text-anchor="middle" fill="#d1fae5" font-size="17">policy / constraints</text>
    <text x="755" y="380" text-anchor="middle" fill="#d1fae5" font-size="17">invariants / verifier</text>

    <rect x="925" y="270" width="205" height="150" rx="18" fill="#4a3421" stroke="#fbbf24" stroke-width="2"/>
    <text x="1028" y="318" text-anchor="middle" fill="#fde68a" font-size="22" font-weight="700">HUMAN GATE</text>
    <text x="1028" y="352" text-anchor="middle" fill="#fef3c7" font-size="17">recommend</text>
    <text x="1028" y="380" text-anchor="middle" fill="#fef3c7" font-size="17">ACK / execute</text>
  </g>

  <g stroke="#7dd3fc" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M305 345 H342"/>
    <path d="M590 345 H627"/>
    <path d="M875 345 H912"/>
  </g>

  <text x="70" y="500" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="24">Learned parameters to exact methods to formal policy to controlled action</text>
  <text x="70" y="551" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="19">10 methods / explicit constraints / verifiable transitions / LLM outside hot path</text>
</svg>
